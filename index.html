<title>Mathe-Kreuzworträtsel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="Kreuzworträtsel">
<style>
/* Layout: blaue Kopfleiste mit Klassen- und Rätselwahl, darunter Gitter links + Hinweise rechts (breit) bzw. untereinander (schmal) */
:root{
  --bg:#f4f7fb; --paper:#ffffff; --ink:#17202b; --muted:#52677d; --line:#17365d; --grid:#dbe4ef;
  --blue:#12365b; --blue-soft:#e4ecf6; --blue-ink:#ffffff; --blue-deep:#0b2540;
  --orange:#c72532; --orange-soft:#fde3e5; --orange-ink:#a01d29;
  --ok:#2e7d4f; --ok-soft:#d8efe0; --bad:#c72532; --bad-soft:#fbe0dc;
  --word:#cfe0f5; --cell-active:#ffe08a;
  --display:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121821; --paper:#1b2430; --ink:#eef2f7; --muted:#a9b4c2; --line:#c9d3df; --grid:#26313f;
  --blue:#12365b; --blue-soft:#1f3350; --blue-ink:#ffffff; --blue-deep:#0b2540;
  --orange:#ff6b74; --orange-soft:#4a2228; --orange-ink:#ffb3b8;
  --ok:#5fc48a; --ok-soft:#1d3a2a; --bad:#ff8a7a; --bad-soft:#4a2420;
  --word:#2a4366; --cell-active:#8a6a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121821; --paper:#1b2430; --ink:#eef2f7; --muted:#a9b4c2; --line:#c9d3df; --grid:#26313f;
  --blue:#12365b; --blue-soft:#1f3350; --blue-ink:#ffffff; --blue-deep:#0b2540;
  --orange:#ff6b74; --orange-soft:#4a2228; --orange-ink:#ffb3b8;
  --ok:#5fc48a; --ok-soft:#1d3a2a; --bad:#ff8a7a; --bad-soft:#4a2420;
  --word:#2a4366; --cell-active:#8a6a12; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:#12365b;color:#fff;padding:25px max(20px,calc(50vw - 480px));padding-left:max(20px,calc(50vw - 480px),env(safe-area-inset-left,0px));padding-right:max(20px,calc(50vw - 480px),env(safe-area-inset-right,0px));display:flex;align-items:center;gap:18px}
header h1{margin:0 0 5px;font-size:29px;line-height:1.15;font-family:var(--display)}header p{margin:0}
.logo{width:64px;height:64px;border-radius:15px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
@media(max-width:560px){.logo{width:48px;height:48px;border-radius:11px}header h1{font-size:24px}}
.pickbar{padding-block:16px 0;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.pickbar .lab{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:inherit;font-weight:800;min-height:44px;min-width:44px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--line);cursor:pointer}
.chip:hover{background:var(--blue-soft)}
.chip[aria-pressed="true"]{background:#12365b;border-color:#12365b;color:#fff}
.chip:disabled{opacity:.45;cursor:default;border-style:dashed}
.chip:disabled:hover{background:var(--paper)}
.chip small{font-weight:700;opacity:.85}
.thema{width:100%;font-weight:700;color:var(--muted)}
main.wrap{padding-block:22px 28px;display:grid;grid-template-columns:minmax(0,auto) minmax(320px,1fr);gap:24px;align-items:start}
@media (max-width:1120px){main.wrap{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:14px}
.board{padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.current{display:flex;gap:10px;align-items:center;min-height:52px;padding:8px 12px;border-radius:10px;background:var(--blue-soft);font-weight:600}
.current .tag{font-family:var(--display);font-weight:800;color:var(--line);white-space:nowrap}
.current .icon svg{display:block}
.gridbox{overflow-x:auto;padding:2px 2px 4px}
.grid{--cell:min(34px,calc((100vw - 64px) / var(--cols)));display:grid;grid-template-columns:repeat(var(--cols),var(--cell));grid-auto-rows:var(--cell);width:max-content;position:relative;margin:0 auto}
.cell{position:relative;border:1.4px solid var(--line);margin:0 -1.4px -1.4px 0;background:var(--paper);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:calc(var(--cell) * .56);cursor:pointer;user-select:none;-webkit-user-select:none;color:var(--ink);transition:background-color .12s}
.cell.sol{background:var(--orange-soft)}
.cell.inword{background:var(--word)}
.cell.active{background:var(--cell-active)}
.cell.bad{background:var(--bad-soft);color:var(--bad)}
.cell.good{color:var(--ok)}
.cell.revealed::after{content:"";position:absolute;left:3px;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--orange)}
.cell .n{position:absolute;left:2px;top:0;font-size:calc(var(--cell) * .27);font-weight:800;line-height:1.1;color:var(--muted)}
.cell .s{position:absolute;right:2px;bottom:0;font-size:calc(var(--cell) * .25);font-weight:800;line-height:1.1;color:var(--orange-ink)}
.empty{pointer-events:none}
#keyin{position:absolute;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;caret-color:transparent;background:transparent;color:transparent}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit}
.btn{font-weight:700;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 14px;min-height:44px;cursor:pointer}
.btn:hover{background:var(--blue-soft)}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.primary:hover{background:var(--blue-deep)}
.status{font-weight:700;color:var(--muted);align-self:center;margin-left:auto}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--bad-soft);font-weight:600}
.loesung{padding:14px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;border:1.8px dashed var(--orange);border-radius:14px;background:var(--paper)}
.loesung h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.loesung p{margin:0;font-size:13px;color:var(--muted);max-width:26ch}
.lw{display:flex;gap:4px;flex-wrap:wrap}
.lw div{position:relative;width:34px;height:36px;border:1.6px solid var(--line);background:var(--orange-soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}
.lw span{position:absolute;right:2px;bottom:0;font-size:9px;font-weight:800;color:var(--orange-ink)}
.lw.done div{background:var(--ok-soft);border-color:var(--ok)}
.clues{padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:619px){.clues{grid-template-columns:minmax(0,1fr)}}
@media (min-width:1121px){.clues{grid-template-columns:minmax(0,1fr)}}
.clues h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.clue{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-radius:8px;padding:6px 8px;min-height:44px;background:transparent;color:var(--ink);font-weight:600;font-size:15px;line-height:1.35;cursor:pointer}
.clue:hover{background:var(--blue-soft)}
.clue b{min-width:22px;color:var(--line);font-weight:800}
.clue .t{flex:1;min-width:0}
.clue.on{background:var(--blue-soft)}
.clue.ok .t{color:var(--ok)}
.clue.ok b::after{content:" ✓";color:var(--ok)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px;font-size:.92em}
.frac>span:last-child{border-top:1.5px solid currentColor;padding:0 3px}
.frac>span:first-child{padding:0 3px 1px}
.clue svg,.current svg{flex:none;color:var(--ink)}
footer.wrap{padding-block:4px 22px;text-align:right;font-size:12px;color:var(--muted)}
.party{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 70%,transparent);z-index:20;padding:20px}
.party .box{max-width:420px;text-align:center;padding:24px;display:flex;flex-direction:column;gap:10px;align-items:center}
.party h2{font-family:var(--display);font-weight:600;font-size:30px;margin:0;color:var(--orange);letter-spacing:.04em}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:21}
@media (prefers-reduced-motion:reduce){.cell{transition:none}}
</style>

const grid=document.getElementById("grid"),keyin=document.getElementById("keyin"),lw=document.getElementById("lw");
let pending=null,P,sol,cellWords,words,num,solIdx,els,clueEls,state,cur,dir,checked,celebrated,KEY;
const layoutHash=p=>{let h=0;const s=JSON.stringify(p.words.map(x=>x.slice(0,4)));for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return (h>>>0).toString(36);};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clueHTML=s=>esc(s).replace(/\{([^|{}]+)\|([^|{}]+)\}/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
const load=()=>{try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.v)return s;}catch(e){}return {v:{},rev:{}};};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};
const idle='<span class="tag">Tippe auf ein Kästchen</span><span>und schreib los. Ein zweites Tippen wechselt zwischen waagerecht und senkrecht. Umlaute (Ä, Ö, Ü) bekommen ein eigenes Kästchen.</span>';

function setup(id){
  P=PUZZLES.find(p=>p.id===id)||PUZZLES[0];
  KEY="kwr-"+P.id+"-"+layoutHash(P);state=load();cur=null;dir="A";checked=false;
  sol={};cellWords={};
  words=P.words.map(([w,r,c,d,clue,icon])=>{const cells=[...w].map((ch,i)=>{const k=(r+(d==="D"?i:0))+","+(c+(d==="A"?i:0));sol[k]=ch;(cellWords[k]=cellWords[k]||{});return k;});return {w,r,c,d,clue,icon,cells};});
  words.forEach(o=>o.cells.forEach(k=>cellWords[k][o.d]=o));
  const starts=[...new Set(words.map(o=>o.r+","+o.c))].sort((a,b)=>{const[ar,ac]=a.split(",").map(Number),[br,bc]=b.split(",").map(Number);return ar-br||ac-bc;});
  num={};starts.forEach((k,i)=>num[k]=i+1);words.forEach(o=>o.n=num[o.r+","+o.c]);
  solIdx={};P.sol.forEach(([r,c],i)=>solIdx[r+","+c]=i+1);
  grid.innerHTML="";grid.style.setProperty("--cols",P.w);els={};
  for(let r=0;r<P.h;r++)for(let c=0;c<P.w;c++){
    const k=r+","+c,d=document.createElement("div");
    if(sol[k]){
      d.className="cell"+(solIdx[k]?" sol":"");d.setAttribute("role","gridcell");
      d.innerHTML=(num[k]?'<span class="n">'+num[k]+'</span>':'')+'<span class="l"></span>'+(solIdx[k]?'<span class="s">'+solIdx[k]+'</span>':'');
      d.addEventListener("click",()=>tapCell(k));els[k]=d;
    }else d.className="empty";
    grid.appendChild(d);
  }
  grid.appendChild(keyin);
  lw.innerHTML=P.sol.map((_,i)=>'<div><b></b><span>'+(i+1)+'</span></div>').join("");
  clueEls=new Map();
  ["A","D"].forEach(d=>{
    const box=document.getElementById("clues"+d);box.innerHTML="";
    words.filter(o=>o.d===d).sort((a,b)=>a.n-b.n).forEach(o=>{
      const b=document.createElement("button");b.type="button";b.className="clue";
      b.innerHTML='<b>'+o.n+'</b><span class="t"></span>'+(o.icon&&IC[o.icon]?IC[o.icon]:"");
      b.querySelector(".t").innerHTML=clueHTML(o.clue)+" ("+o.w.length+")";
      b.addEventListener("click",()=>selectWord(o,firstEmpty(o)));
      box.appendChild(b);clueEls.set(o,b);
    });
  });
  const kl=KLASSEN.find(k=>k[0]===P.klasse)[1];
  const klText=P.klasse==="OS"?kl:"Klasse "+kl;
  document.getElementById("sub").textContent=klText+" · Emil-Petri-Schule Arnstadt";
  document.getElementById("thema").textContent="Rätsel "+P.nr+": "+P.thema;
  document.title="Mathe-Kreuzworträtsel "+klText+" – Rätsel "+P.nr;
  document.getElementById("current").innerHTML=idle;
  document.getElementById("confirm").hidden=true;pending=null;
  celebrated=correctWords().length===words.length;
  renderPickers();render();setStatus();
}
function renderPickers(){
  const kBox=document.getElementById("klassen");kBox.innerHTML="";
  KLASSEN.forEach(([k,label])=>{
    const list=PUZZLES.filter(p=>p.klasse===k),b=document.createElement("button");
    b.type="button";b.className="chip";b.textContent=label;b.setAttribute("aria-pressed",String(P.klasse===k));
    if(!list.length){b.disabled=true;b.title="Folgt bald";b.insertAdjacentHTML("beforeend"," <small>bald</small>");}
    else b.addEventListener("click",()=>go(list[0].id));
    kBox.appendChild(b);
  });
  const rBox=document.getElementById("raetsel");rBox.innerHTML="";
  PUZZLES.filter(p=>p.klasse===P.klasse).forEach(p=>{
    const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=String(p.nr);
    b.title=p.thema;b.setAttribute("aria-label","Rätsel "+p.nr+": "+p.thema);b.setAttribute("aria-pressed",String(p.id===P.id));
    b.addEventListener("click",()=>go(p.id));rBox.appendChild(b);
  });
}
function go(id){if(location.hash!=="#"+id)location.hash=id;else setup(id);}
window.addEventListener("hashchange",()=>setup(location.hash.slice(1)));

function firstEmpty(o){return o.cells.find(k=>!state.v[k])||o.cells[0];}
function wordAt(k,d){return cellWords[k]&&cellWords[k][d];}
function tapCell(k){
  if(cur===k){const other=dir==="A"?"D":"A";if(wordAt(k,other))dir=other;}
  else if(!wordAt(k,dir))dir=dir==="A"?"D":"A";
  cur=k;render();focusInput();
}
function selectWord(o,k){dir=o.d;cur=k;render();focusInput();}
function focusInput(){
  const e=els[cur];if(!e)return;
  keyin.style.left=e.offsetLeft+"px";keyin.style.top=e.offsetTop+"px";
  keyin.value=" ";keyin.focus({preventScroll:true});try{keyin.setSelectionRange(1,1);}catch(e){}
}
function step(delta){const o=wordAt(cur,dir);if(!o)return;const i=o.cells.indexOf(cur)+delta;if(i>=0&&i<o.cells.length)cur=o.cells[i];}
function putLetter(ch){if(!cur)return;state.v[cur]=ch;delete state.rev[cur];checked=false;save();step(1);render();afterChange();}
function backspace(){if(!cur)return;if(state.v[cur])delete state.v[cur];else{step(-1);delete state.v[cur];}checked=false;save();render();}
keyin.addEventListener("input",()=>{
  const v=keyin.value;
  if(v.length===0)backspace();
  else{const ch=v.slice(-1).toUpperCase();if(/^([A-ZÄÖÜ]|SS)$/.test(ch))[...ch].forEach(putLetter);}
  keyin.value=" ";try{keyin.setSelectionRange(1,1);}catch(e){}
});
keyin.addEventListener("keydown",ev=>{
  if(!cur)return;
  const m={ArrowRight:[0,1,"A"],ArrowLeft:[0,-1,"A"],ArrowDown:[1,0,"D"],ArrowUp:[-1,0,"D"]}[ev.key];
  if(m){ev.preventDefault();const [r,c]=cur.split(",").map(Number),k=(r+m[0])+","+(c+m[1]);
    if(sol[k]){cur=k;if(wordAt(k,m[2]))dir=m[2];}else if(wordAt(cur,m[2]))dir=m[2];render();focusInput();}
  else if(ev.key==="Backspace"&&keyin.value===" "){ev.preventDefault();backspace();}
  else if(ev.key==="Tab"){ev.preventDefault();const list=[...clueEls.keys()].sort((a,b)=>(a.d===b.d?a.n-b.n:a.d==="A"?-1:1));const o=wordAt(cur,dir);const i=(list.indexOf(o)+(ev.shiftKey?-1:1)+list.length)%list.length;selectWord(list[i],firstEmpty(list[i]));}
});
function correctWords(){return words.filter(o=>o.cells.every(k=>state.v[k]===sol[k]));}
function render(){
  const o=cur?wordAt(cur,dir):null;
  for(const k in els){const e=els[k],v=state.v[k]||"";
    e.querySelector(".l").textContent=v;
    e.classList.toggle("inword",!!(o&&o.cells.includes(k)));e.classList.toggle("active",k===cur);
    e.classList.toggle("revealed",!!state.rev[k]);
    e.classList.toggle("bad",checked&&!!v&&v!==sol[k]);e.classList.toggle("good",checked&&!!v&&v===sol[k]);}
  const ok=new Set(checked?correctWords():[]);
  clueEls.forEach((b,w)=>{b.classList.toggle("on",w===o);b.classList.toggle("ok",ok.has(w));});
  if(o){const c=document.getElementById("current");c.innerHTML='<span class="tag">'+o.n+' '+(o.d==="A"?"waagerecht":"senkrecht")+'</span><span class="t"></span><span class="icon">'+(o.icon&&IC[o.icon]?IC[o.icon]:"")+'</span>';c.querySelector(".t").innerHTML=clueHTML(o.clue)+" ("+o.w.length+" Buchstaben)";}
  const lws=[...lw.children];let word="";
  P.sol.forEach(([r,c],i)=>{const v=state.v[r+","+c]||"";lws[i].querySelector("b").textContent=v;word+=v||"_";});
  lw.classList.toggle("done",word===P.solword&&correctWords().length===words.length);
}
function afterChange(){if(correctWords().length===words.length&&!celebrated){celebrated=true;checked=true;render();setStatus();celebrate();}}
function setStatus(){document.getElementById("status").textContent=correctWords().length+" von "+words.length+" Begriffen richtig";}
document.getElementById("btnCheck").addEventListener("click",()=>{checked=true;render();setStatus();afterChange();});
document.getElementById("btnHint").addEventListener("click",()=>{
  if(!cur||state.v[cur]===sol[cur]){const o=(cur&&wordAt(cur,dir)&&wordAt(cur,dir).cells.some(k=>state.v[k]!==sol[k]))?wordAt(cur,dir):words.find(o=>o.cells.some(k=>state.v[k]!==sol[k]));if(!o)return;dir=o.d;cur=o.cells.find(k=>state.v[k]!==sol[k]);}
  state.v[cur]=sol[cur];state.rev[cur]=1;save();step(1);render();focusInput();afterChange();
});
const conf=document.getElementById("confirm");
function ask(text,fn){document.getElementById("confirmText").textContent=text;pending=fn;conf.hidden=false;document.getElementById("confirmNo").focus();}
document.getElementById("confirmYes").addEventListener("click",()=>{conf.hidden=true;if(pending)pending();pending=null;});
document.getElementById("confirmNo").addEventListener("click",()=>{conf.hidden=true;pending=null;});
document.getElementById("btnSolve").addEventListener("click",()=>ask("Wirklich die ganze Lösung anzeigen?",()=>{
  for(const k in sol){if(state.v[k]!==sol[k]){state.v[k]=sol[k];state.rev[k]=1;}}celebrated=true;checked=true;save();render();setStatus();}));
document.getElementById("btnReset").addEventListener("click",()=>ask("Alle Eingaben in diesem Rätsel löschen und neu anfangen?",()=>{
  state={v:{},rev:{}};celebrated=false;checked=false;cur=null;save();render();setStatus();document.getElementById("current").innerHTML=idle;}));
const party=document.getElementById("party"),cv=document.getElementById("confetti");
document.getElementById("partyClose").addEventListener("click",()=>{party.hidden=true;cv.hidden=true;});
function celebrate(){
  document.getElementById("partyWord").textContent=P.solword+"!";
  document.getElementById("partyText").textContent="Super, alle "+words.length+" Begriffe sind richtig!";
  party.hidden=false;document.getElementById("partyClose").focus();
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  cv.hidden=false;const ctx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#12365b","#c72532","#4a86c5","#f2b632","#9aa9bb"];
  const ps=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vy:2+Math.random()*3,vx:-1+Math.random()*2,s:5+Math.random()*6,a:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;(function f(){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});
    if(++t<240&&!cv.hidden)requestAnimationFrame(f);else cv.hidden=true;})();
}
setup(location.hash.slice(1)||"k5-1");
})();
</script>
